# 句读 JUDOU · Nginx 反代示例（阿里云 ECS）
# 放到 /etc/nginx/conf.d/judou.conf，把 judou.example.com 换成你的域名或公网 IP。

server {
    listen 80;
    server_name judou.example.com;

    # 如果绑了域名并申请了证书，把下面几行打开（certbot 会自动写）
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/judou.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/judou.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE / 流式响应时别缓冲
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }
}
